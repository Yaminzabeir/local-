<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunity Details - Local Volunteer Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Local Volunteer <span class="highlight">Hub</span></a>
            <div class="nav-links">
                <a href="opportunities.html" class="nav-link">Opportunities</a>
                <a href="organizations.html" class="nav-link">Organizations</a>
                <a href="dashboard.html" class="nav-link">Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- Loading state -->
    <div id="loading" style="padding-top:calc(var(--nav-height) + 4rem); text-align:center; color:var(--text-muted);">
        Loading opportunity...
    </div>

    <!-- Content -->
    <div id="content" style="display:none;">
        <header class="detail-header">
            <div class="container">
                <a href="opportunities.html" class="back-link">← Back to Opportunities</a>
                <div style="color:var(--primary); font-weight:700; text-transform:uppercase; letter-spacing:0.05em; font-size:0.8rem; margin-bottom:0.75rem;"
                    id="org-name">Organization</div>
                <h1 style="font-size:2.5rem; letter-spacing:-0.03em;" id="opp-title">Opportunity Title</h1>
            </div>
        </header>

        <div class="detail-container">
            <div class="meta-row">
                <div class="meta-item">📍 <strong id="opp-location">Location</strong></div>
                <div class="meta-item">📅 <strong id="opp-date">Date</strong></div>
                <div class="meta-item">👥 <strong id="opp-slots">Slots</strong></div>
                <div class="meta-item">🕒 <strong id="opp-time">Time</strong></div>
            </div>

            <div class="description-box" id="opp-desc">Description goes here...</div>

            <div style="display:flex; gap:1rem; justify-content:center; padding-bottom:4rem;">
                <button class="btn btn-primary btn-lg" id="apply-btn">Apply Now →</button>
                <a href="opportunities.html" class="btn btn-outline btn-lg">Browse More</a>
            </div>
        </div>
    </div>

    <!-- Application Modal -->
    <div class="modal" id="apply-modal">
        <div class="modal-content">
            <h2 class="modal-title">Apply for <span id="modal-opp-title"
                    style="color:var(--primary);">Opportunity</span></h2>
            <p class="modal-sub">Confirm your interest in this volunteer role.</p>
            <form id="apply-form">
                <input type="hidden" id="opp-id-input">
                <div class="form-group">
                    <label>Why are you interested?</label>
                    <textarea rows="4" placeholder="Tell us briefly about your motivation..."></textarea>
                </div>
                <div style="display:flex; gap:1rem; justify-content:flex-end; margin-top:1.5rem;">
                    <button type="button" class="btn btn-outline"
                        onclick="document.getElementById('apply-modal').classList.remove('open')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Submit Application →</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/opportunity-detail.js"></script>
    <script src="js/chatbot.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizations - Local Volunteer Hub</title>
    <meta name="description"
        content="Browse non-profit organizations on Local Volunteer Hub looking for passionate volunteers.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Local Volunteer <span class="highlight">Hub</span></a>
            <div class="nav-links">
                <a href="opportunities.html" class="nav-link" data-i18n="nav.opportunities">Opportunities</a>
                <a href="organizations.html" class="nav-link" style="color:var(--primary);"
                    data-i18n="nav.organizations">Organizations</a>
                <a href="dashboard.html" class="nav-link" id="nav-dashboard" style="display:none;"
                    data-i18n="nav.dashboard">Dashboard</a>
                <a href="login.html" class="btn btn-outline btn-sm" id="nav-login" data-i18n="nav.login">Log In</a>
                <button class="lang-switch-btn" onclick="window.__toggleLang && window.__toggleLang()">🇸🇦
                    العربية</button>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header" style="padding-top: calc(var(--nav-height) + 2rem);">
        <div class="container">
            <div class="section-tag" style="display:inline-flex; margin-bottom:1rem;" data-i18n="orgs.tag">🏢 Community
                Partners</div>
            <h1 class="section-title" style="font-size:2.5rem; margin-bottom:0.75rem;" data-i18n="orgs.title">Partner
                Organizations</h1>
            <p style="color:var(--text-muted); max-width:560px; margin:0 auto;" data-i18n="orgs.subtitle">Connect with
                the non-profit
                organizations making a real difference in your community.</p>
        </div>
    </div>

    <!-- Organizations Grid -->
    <div class="container" style="padding-top:2.5rem;">
        <div class="org-grid" id="org-grid">
            <div class="loading-state" style="grid-column:1/-1;" data-i18n="orgs.loading">Loading organizations...</div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase-client.js';
        import { t, toggleLanguage } from './js/i18n.js';
        window.__toggleLang = toggleLanguage;

        document.addEventListener('DOMContentLoaded', async () => {
            // Auth check — use localStorage (consistent with dashboard.js)
            const stored = localStorage.getItem('user_profile');
            if (!stored) { window.location.href = 'login.html'; return; }
            let user;
            try { user = JSON.parse(stored); } catch (e) { window.location.href = 'login.html'; return; }
            if (!user || !user.id) { window.location.href = 'login.html'; return; }

            // Update Navbar
            document.getElementById('nav-login').style.display = 'none';
            document.getElementById('nav-dashboard').style.display = 'inline-block';

            const grid = document.getElementById('org-grid');
            const { data: orgs, error } = await supabase
                .from('organizations').select('*').eq('status', 'approved').order('organization_name');
            if (error) { grid.innerHTML = `<div class="loading-state" style="color:var(--red);">${t('orgs.error')}</div>`; return; }
            if (!orgs || orgs.length === 0) { grid.innerHTML = `<div class="loading-state">${t('orgs.noResults')}</div>`; return; }
            grid.innerHTML = orgs.map(org => `
      <div class="org-card">
        <h3 class="org-name">${org.organization_name}</h3>
        <p class="org-desc">${org.description || t('orgs.noDesc')}</p>
        <div class="org-meta">
          <div>📍 ${org.address || t('orgs.noLocation')}</div>
          <div>📧 ${org.contact_email || t('orgs.noEmail')}</div>
          ${org.contact_phone ? `<div>📞 ${org.contact_phone}</div>` : ''}
        </div>
        <a href="messages.html?recipient_id=${org.user_id}&name=${encodeURIComponent(org.organization_name)}"
           class="btn btn-primary" style="text-align:center; display:block;">${t('orgs.messageBtn')}</a>
      </div>
    `).join('');
        });
    </script>
    <script src="js/chatbot.js"></script>
</body>

</html>

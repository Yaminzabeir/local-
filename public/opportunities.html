<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Opportunities - Local Volunteer Hub</title>
    <meta name="description" content="Browse and apply for local volunteer opportunities near you.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Local Volunteer <span class="highlight">Hub</span></a>
            <div class="nav-links">
                <a href="opportunities.html" class="nav-link" style="color:var(--primary);">Opportunities</a>
                <a href="organizations.html" class="nav-link">Organizations</a>
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="login.html" class="btn btn-outline btn-sm">Log In</a>
            </div>
        </div>
    </nav>

    <!-- Page Hero -->
    <div class="page-hero">
        <div class="container text-center">
            <div class="section-tag purple" style="display:inline-flex; margin-bottom:1rem;">🔍 Find Your Cause</div>
            <h1 class="section-title" style="font-size:2.5rem; margin-bottom:0.75rem;">Browse Opportunities</h1>
            <p style="color:var(--text-muted); max-width:560px; margin:0 auto 2rem;">Find meaningful volunteer work that
                fits your schedule, location, and passions.</p>
            <div class="search-bar-wrap">
                <input type="text" placeholder="Search opportunities..." class="search-input" id="search-input">
                <select class="filter-select" id="location-filter">
                    <option value="">Any Location</option>
                    <option value="Bangladesh">Bangladesh</option>
                    <option value="Remote">Remote</option>
                    <option value="Dhaka">Dhaka</option>
                    <option value="Chittagong">Chittagong</option>
                </select>
                <button class="btn btn-primary" id="search-btn">Search</button>
            </div>
        </div>
    </div>

    <!-- Opportunities Grid -->
    <div class="container" style="padding-top:2.5rem;">
        <div class="opp-grid" id="opportunities-grid">
            <div class="loading-state" style="grid-column:1/-1;">Loading opportunities...</div>
        </div>
    </div>

    <!-- Application Modal -->
    <div class="modal" id="apply-modal">
        <div class="modal-content">
            <h2 class="modal-title">Apply for <span id="modal-opp-title"
                    style="color:var(--primary);">Opportunity</span></h2>
            <p class="modal-sub">Confirm your interest in this volunteer role.</p>
            <form id="apply-form">
                <input type="hidden" id="opp-id-input">
                <div class="form-group">
                    <label>Why are you interested?</label>
                    <textarea rows="4" placeholder="Tell us briefly about your motivation..."
                        style="resize:vertical;"></textarea>
                </div>
                <div style="display:flex; gap:1rem; justify-content:flex-end; margin-top:1.5rem;">
                    <button type="button" class="btn btn-outline"
                        onclick="document.getElementById('apply-modal').classList.remove('open')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Submit Application →</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/opportunities.js"></script>
    <script src="js/chatbot.js"></script>
</body>

</html>

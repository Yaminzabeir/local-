<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Opportunities - Local Volunteer Hub</title>
    <meta name="description" content="Browse and apply for local volunteer opportunities near you.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Local Volunteer <span class="highlight">Hub</span></a>
            <div class="nav-links">
                <a href="opportunities.html" class="nav-link" style="color:var(--primary);"
                    data-i18n="nav.opportunities">Opportunities</a>
                <a href="organizations.html" class="nav-link" data-i18n="nav.organizations">Organizations</a>
                <a href="dashboard.html" class="nav-link" data-i18n="nav.dashboard">Dashboard</a>
                <a href="login.html" class="btn btn-outline btn-sm" data-i18n="nav.login">Log In</a>
                <button class="lang-switch-btn" onclick="window.__toggleLang && window.__toggleLang()">🇸🇦
                    العربية</button>
            </div>
        </div>
    </nav>

    <!-- Page Hero -->
    <div class="page-hero">
        <div class="container text-center">
            <div class="section-tag purple" style="display:inline-flex; margin-bottom:1rem;" data-i18n="opps.tag">🔍
                Find Your Cause</div>
            <h1 class="section-title" style="font-size:2.5rem; margin-bottom:0.75rem;" data-i18n="opps.title">Browse
                Opportunities</h1>
            <p style="color:var(--text-muted); max-width:560px; margin:0 auto 2rem;" data-i18n="opps.subtitle">Find
                meaningful volunteer work that
                fits your schedule, location, and passions.</p>
            <div class="search-bar-wrap">
                <input type="text" class="search-input" id="search-input" data-i18n-placeholder="opps.searchPlaceholder"
                    placeholder="Search opportunities...">
                <select class="filter-select" id="location-filter">
                    <option value="" data-i18n="opps.anyLocation">Any Location</option>
                    <option value="Riyadh">Riyadh</option>
                    <option value="Jeddah">Jeddah</option>
                    <option value="Dammam">Dammam</option>
                    <option value="Mecca">Mecca</option>
                    <option value="Medina">Medina</option>
                    <option value="Remote">Remote</option>
                </select>
                <button class="btn btn-primary" id="search-btn" data-i18n="opps.search">Search</button>
            </div>
        </div>
    </div>

    <!-- Opportunities Grid -->
    <div class="container" style="padding-top:2.5rem;">
        <div class="opp-grid" id="opportunities-grid">
            <div class="loading-state" style="grid-column:1/-1;" data-i18n="opps.loading">Loading opportunities...</div>
        </div>
    </div>

    <!-- Application Modal -->
    <div class="modal" id="apply-modal">
        <div class="modal-content">
            <h2 class="modal-title"><span data-i18n="modal.applyFor">Apply for</span> <span id="modal-opp-title"
                    style="color:var(--primary);">Opportunity</span></h2>
            <p class="modal-sub" data-i18n="modal.confirmInterest">Confirm your interest in this volunteer role.</p>
            <form id="apply-form">
                <input type="hidden" id="opp-id-input">
                <div class="form-group">
                    <label data-i18n="modal.whyInterested">Why are you interested?</label>
                    <textarea rows="4" style="resize:vertical;" data-i18n-placeholder="modal.motivationPlaceholder"
                        placeholder="Tell us briefly about your motivation..."></textarea>
                </div>
                <div style="display:flex; gap:1rem; justify-content:flex-end; margin-top:1.5rem;">
                    <button type="button" class="btn btn-outline"
                        onclick="document.getElementById('apply-modal').classList.remove('open')"
                        data-i18n="modal.cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" data-i18n="modal.submitApp">Submit Application
                        →</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { toggleLanguage } from './js/i18n.js';
        window.__toggleLang = toggleLanguage;
    </script>
    <script type="module" src="js/opportunities.js"></script>
    <script src="js/chatbot.js"></script>
</body>

</html>
